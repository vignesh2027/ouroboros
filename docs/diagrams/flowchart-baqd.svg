<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="960" height="760" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="760" fill="#FFFFFF"/>

  <text x="480" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#111111">Flowchart: BAQD drift score for one hop</text>
  <text x="480" y="54" text-anchor="middle" font-size="12.5" fill="#5E5E5E">Module: ouroboros/metric.py</text>

  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5E5E5E"/>
    </marker>
  </defs>

  <!-- terminator start -->
  <rect x="368" y="76" width="200" height="40" rx="20" fill="#111111"/>
  <text x="468" y="101" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">START hop n</text>

  <path d="M468 116 V142" stroke="#5E5E5E" stroke-width="1.5" fill="none" marker-end="url(#a2)"/>

  <!-- input parallelogram -->
  <path d="M300 148 L660 148 L630 196 L270 196 z" fill="#FBF5E3" stroke="#8A6D0B" stroke-width="1.6"/>
  <text x="464" y="168" text-anchor="middle" font-size="12.5" fill="#111111">INPUT: original question, current belief,</text>
  <text x="464" y="184" text-anchor="middle" font-size="12.5" fill="#111111">and the query just written for this hop</text>

  <path d="M468 196 V224" stroke="#5E5E5E" stroke-width="1.5" fill="none" marker-end="url(#a2)"/>

  <!-- process: encode -->
  <rect x="300" y="228" width="336" height="48" fill="#EDF3F9" stroke="#1B5E9E" stroke-width="1.6"/>
  <text x="468" y="248" text-anchor="middle" font-size="12.5" fill="#111111">Encode all three into vectors</text>
  <text x="468" y="265" text-anchor="middle" font-size="10.5" fill="#5E5E5E">shared TF-IDF vocabulary fitted on the whole collection</text>

  <path d="M468 276 V302" stroke="#5E5E5E" stroke-width="1.5" fill="none" marker-end="url(#a2)"/>

  <!-- decision: zero vector -->
  <path d="M468 306 L636 348 L468 390 L300 348 z" fill="#FBF5E3" stroke="#8A6D0B" stroke-width="1.6"/>
  <text x="468" y="344" text-anchor="middle" font-size="12" fill="#111111">is the belief vector</text>
  <text x="468" y="359" text-anchor="middle" font-size="12" fill="#111111">all zero</text>

  <!-- yes branch -->
  <path d="M636 348 H770" stroke="#5E5E5E" stroke-width="1.5" fill="none" marker-end="url(#a2)"/>
  <text x="700" y="340" text-anchor="middle" font-size="11" font-weight="bold" fill="#8A6D0B">yes</text>
  <rect x="776" y="326" width="158" height="44" fill="#FBEEEC" stroke="#B23A2B" stroke-width="1.6"/>
  <text x="855" y="345" text-anchor="middle" font-size="12" fill="#111111">Return 0.0</text>
  <text x="855" y="361" text-anchor="middle" font-size="10" fill="#5E5E5E">no division by zero</text>

  <!-- no branch continues down -->
  <text x="486" y="412" font-size="11" font-weight="bold" fill="#8A6D0B">no</text>
  <path d="M468 390 V422" stroke="#5E5E5E" stroke-width="1.5" fill="none" marker-end="url(#a2)"/>

  <!-- two parallel computations -->
  <rect x="200" y="422" width="246" height="56" fill="#EDF3F9" stroke="#1B5E9E" stroke-width="1.6"/>
  <text x="323" y="444" text-anchor="middle" font-size="12.5" fill="#111111">A = cos(query, belief)</text>
  <text x="323" y="462" text-anchor="middle" font-size="10.5" fill="#5E5E5E">how close the new query sits to the belief</text>

  <rect x="490" y="422" width="246" height="56" fill="#EDF3F9" stroke="#1B5E9E" stroke-width="1.6"/>
  <text x="613" y="444" text-anchor="middle" font-size="12.5" fill="#111111">B = cos(question, belief)</text>
  <text x="613" y="462" text-anchor="middle" font-size="10.5" fill="#5E5E5E">how close the neutral question sat</text>

  <path d="M468 422 L360 422" stroke="#5E5E5E" stroke-width="1.5" fill="none"/>
  <path d="M468 422 L576 422" stroke="#5E5E5E" stroke-width="1.5" fill="none"/>
  <path d="M323 410 V418" stroke="#5E5E5E" stroke-width="1.5" fill="none" marker-end="url(#a2)"/>
  <path d="M613 410 V418" stroke="#5E5E5E" stroke-width="1.5" fill="none" marker-end="url(#a2)"/>
  <path d="M323 410 H613" stroke="#5E5E5E" stroke-width="1.5" fill="none"/>

  <!-- subtract -->
  <path d="M323 478 V512 H468" stroke="#5E5E5E" stroke-width="1.5" fill="none"/>
  <path d="M613 478 V512 H468" stroke="#5E5E5E" stroke-width="1.5" fill="none"/>
  <path d="M468 512 V538" stroke="#5E5E5E" stroke-width="1.5" fill="none" marker-end="url(#a2)"/>

  <rect x="300" y="538" width="336" height="48" fill="#EAF3EF" stroke="#157A57" stroke-width="2"/>
  <text x="468" y="558" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#157A57">BAQD = A minus B</text>
  <text x="468" y="576" text-anchor="middle" font-size="10.5" fill="#5E5E5E">one subtraction, no training, no GPU</text>

  <!-- decision on threshold -->
  <path d="M468 614 L636 654 L468 694 L300 654 z" fill="#FBF5E3" stroke="#8A6D0B" stroke-width="1.6"/>
  <text x="468" y="650" text-anchor="middle" font-size="12" fill="#111111">BAQD above the</text>
  <text x="468" y="665" text-anchor="middle" font-size="12" fill="#111111">drift threshold</text>
  <path d="M468 586 V610" stroke="#5E5E5E" stroke-width="1.5" fill="none" marker-end="url(#a2)"/>

  <!-- outcomes -->
  <path d="M300 654 H180" stroke="#5E5E5E" stroke-width="1.5" fill="none" marker-end="url(#a2)"/>
  <text x="240" y="646" text-anchor="middle" font-size="11" font-weight="bold" fill="#8A6D0B">no</text>
  <rect x="20" y="632" width="152" height="44" fill="#EAF3EF" stroke="#157A57" stroke-width="1.6"/>
  <text x="96" y="651" text-anchor="middle" font-size="12" fill="#111111">Searching fairly</text>
  <text x="96" y="667" text-anchor="middle" font-size="10" fill="#5E5E5E">continue to next hop</text>

  <path d="M636 654 H770" stroke="#5E5E5E" stroke-width="1.5" fill="none" marker-end="url(#a2)"/>
  <text x="700" y="646" text-anchor="middle" font-size="11" font-weight="bold" fill="#8A6D0B">yes</text>
  <rect x="776" y="632" width="158" height="44" fill="#FBEEEC" stroke="#B23A2B" stroke-width="1.6"/>
  <text x="855" y="651" text-anchor="middle" font-size="12" fill="#111111">Flag drift at this hop</text>
  <text x="855" y="667" text-anchor="middle" font-size="10" fill="#5E5E5E">record in the trace log</text>

  <!-- end -->
  <rect x="368" y="712" width="200" height="38" rx="19" fill="#111111"/>
  <text x="468" y="736" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">END hop n</text>
  <path d="M96 676 V730 H360" stroke="#5E5E5E" stroke-width="1.5" fill="none" marker-end="url(#a2)"/>
  <path d="M855 676 V730 H576" stroke="#5E5E5E" stroke-width="1.5" fill="none" marker-end="url(#a2)"/>
  <path d="M855 370 V600 H944 V730 H576" stroke="#5E5E5E" stroke-width="1.2" fill="none" stroke-dasharray="5 4"/>
</svg>
