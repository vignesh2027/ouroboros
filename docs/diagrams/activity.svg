<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 900" width="960" height="900" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="900" fill="#FFFFFF"/>

  <text x="480" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#111111">Activity Diagram</text>
  <text x="480" y="54" text-anchor="middle" font-size="12.5" fill="#5E5E5E">Drift experiment, one run across every question and both arms</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5E5E5E"/>
    </marker>
  </defs>
  <g stroke="#5E5E5E" stroke-width="1.5" fill="none" marker-end="url(#ar)" id="flow">
    <path d="M300 92 V112"/>
    <path d="M300 156 V176"/>
    <path d="M300 220 V240"/>
    <path d="M300 284 V318"/>
    <path d="M300 362 V392"/>
    <path d="M300 436 V456"/>
    <path d="M300 500 V520"/>
    <path d="M300 564 V584"/>
    <path d="M300 628 V648"/>
    <path d="M300 692 V726"/>
  </g>

  <!-- start -->
  <circle cx="300" cy="82" r="11" fill="#111111"/>
  <text x="330" y="86" font-size="11.5" fill="#5E5E5E">start</text>

  <!-- activities -->
  <g fill="#EDF3F9" stroke="#1B5E9E" stroke-width="1.6">
    <rect x="186" y="112" width="228" height="44" rx="10"/>
    <rect x="186" y="176" width="228" height="44" rx="10"/>
    <rect x="186" y="392" width="228" height="44" rx="10"/>
    <rect x="186" y="456" width="228" height="44" rx="10"/>
    <rect x="186" y="520" width="228" height="44" rx="10"/>
    <rect x="186" y="584" width="228" height="44" rx="10"/>
    <rect x="186" y="648" width="228" height="44" rx="10"/>
  </g>
  <g font-size="12.5" fill="#111111" text-anchor="middle">
    <text x="300" y="132">Load SPIRAL-Bench corpus</text>
    <text x="300" y="148" font-size="10.5" fill="#5E5E5E">8 questions, 64 passages</text>
    <text x="300" y="196">Fit encoder on whole collection</text>
    <text x="300" y="212" font-size="10.5" fill="#5E5E5E">one vocabulary for every question</text>
    <text x="300" y="412">Take next query for this hop</text>
    <text x="300" y="428" font-size="10.5" fill="#5E5E5E">drift wording or neutral wording</text>
    <text x="300" y="476">Compute BAQD drift score</text>
    <text x="300" y="492" font-size="10.5" fill="#5E5E5E">three embeddings, two cosines</text>
    <text x="300" y="540">Retrieve top k passages</text>
    <text x="300" y="556" font-size="10.5" fill="#5E5E5E">ranked by cosine on wording</text>
    <text x="300" y="604">Measure evidence balance</text>
    <text x="300" y="620" font-size="10.5" fill="#5E5E5E">count supporting against opposing</text>
    <text x="300" y="668">Set belief to what was just read</text>
    <text x="300" y="684" font-size="10.5" fill="#5E5E5E">this feeds the next hop</text>
  </g>

  <!-- loop headers as decisions -->
  <g fill="#FBF5E3" stroke="#8A6D0B" stroke-width="1.6">
    <path d="M300 240 L392 262 L300 284 L208 262 z"/>
    <path d="M300 318 L392 340 L300 362 L208 340 z"/>
  </g>
  <g font-size="11.5" fill="#111111" text-anchor="middle">
    <text x="300" y="259">more questions</text><text x="300" y="272">to process</text>
    <text x="300" y="337">arm: drift</text><text x="300" y="350">or neutral</text>
  </g>

  <!-- hop decision -->
  <path d="M300 726 L400 750 L300 774 L200 750 z" fill="#FBF5E3" stroke="#8A6D0B" stroke-width="1.6"/>
  <text x="300" y="747" text-anchor="middle" font-size="11.5" fill="#111111">more hops</text>
  <text x="300" y="760" text-anchor="middle" font-size="11.5" fill="#111111">remaining</text>

  <!-- loop back from hop decision to take query -->
  <path d="M200 750 H120 V414 H182" stroke="#8A6D0B" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="128" y="580" font-size="11" fill="#8A6D0B" font-weight="bold" transform="rotate(-90 128 580)">yes, next hop</text>

  <!-- loop back for arms -->
  <path d="M392 340 H470 V262" stroke="#8A6D0B" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="478" y="305" font-size="11" fill="#8A6D0B">second arm</text>

  <!-- exit from hop decision -->
  <path d="M400 750 H560" stroke="#5E5E5E" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="470" y="742" text-anchor="middle" font-size="11" fill="#5E5E5E">no</text>

  <g fill="#EAF3EF" stroke="#157A57" stroke-width="1.6">
    <rect x="566" y="728" width="222" height="44" rx="10"/>
    <rect x="566" y="630" width="222" height="44" rx="10"/>
    <rect x="566" y="532" width="222" height="44" rx="10"/>
  </g>
  <g font-size="12.5" fill="#111111" text-anchor="middle">
    <text x="677" y="748">Append rows to trace log</text>
    <text x="677" y="764" font-size="10.5" fill="#5E5E5E">one row per retrieval</text>
    <text x="677" y="650">Run oracle diagnostic</text>
    <text x="677" y="666" font-size="10.5" fill="#5E5E5E">best case a query could reach</text>
    <text x="677" y="552">Generate results chart</text>
    <text x="677" y="568" font-size="10.5" fill="#5E5E5E">rebuilt from the log, never by hand</text>
  </g>
  <g stroke="#5E5E5E" stroke-width="1.5" fill="none" marker-end="url(#ar)">
    <path d="M677 728 V680"/>
    <path d="M677 630 V582"/>
    <path d="M677 532 V498"/>
  </g>

  <!-- back up to questions loop -->
  <path d="M566 750 H520 V262 H392" stroke="#8A6D0B" stroke-width="1.5" fill="none" marker-end="url(#ar)" stroke-dasharray="5 4"/>
  <text x="513" y="470" font-size="11" fill="#8A6D0B" transform="rotate(-90 513 470)">next question</text>

  <!-- end -->
  <circle cx="677" cy="480" r="13" fill="none" stroke="#111111" stroke-width="2"/>
  <circle cx="677" cy="480" r="7" fill="#111111"/>
  <text x="710" y="484" font-size="11.5" fill="#5E5E5E">end</text>

  <!-- no branch of questions decision -->
  <text x="300" y="300" text-anchor="middle" font-size="11" fill="#8A6D0B">yes</text>

  <!-- legend -->
  <g font-size="10.5" fill="#5E5E5E">
    <rect x="120" y="840" width="16" height="11" rx="3" fill="#EDF3F9" stroke="#1B5E9E" stroke-width="1.4"/>
    <text x="144" y="850">experiment step</text>
    <path d="M300 840 L316 845.5 L300 851 L284 845.5 z" fill="#FBF5E3" stroke="#8A6D0B" stroke-width="1.4"/>
    <text x="324" y="850">decision or loop</text>
    <rect x="470" y="840" width="16" height="11" rx="3" fill="#EAF3EF" stroke="#157A57" stroke-width="1.4"/>
    <text x="494" y="850">output produced for the review</text>
  </g>
</svg>
