name: experiments

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run experiment 1
        run: python3 run_experiment.py
      - name: Run diagnostic
        run: python3 run_diagnostic.py
      - name: Rebuild figure
        run: python3 make_chart.py
      - name: Check the corpus is still balanced
        run: python3 scripts/build_hf_dataset.py
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: outputs/
